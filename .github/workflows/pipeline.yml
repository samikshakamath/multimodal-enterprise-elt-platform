name: Multimodal ELT Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  validate-project:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Project Structure
        run: |
          test -d app
          test -d src

      - name: Verify FastAPI App
        run: |
          python -m py_compile app/main.py

      - name: Verify Processing Scripts
        run: |
          python -m py_compile src/classification/classifier.py
          python -m py_compile src/ingestion/storage.py
          python -m py_compile src/processing/document_processor.py
          python -m py_compile src/processing/image_processor.py
          python -m py_compile src/processing/log_processor.py
          python -m py_compile src/processing/transcript_processor.py
          python -m py_compile src/quality/validate_documents.py
          python -m py_compile src/quality/validate_images.py
          python -m py_compile src/quality/validate_logs.py
          python -m py_compile src/quality/validate_transcripts.py
          python -m py_compile src/transformations/bronze_to_silver.py
          python -m py_compile src/transformations/document_bronze_to_silver.py
          python -m py_compile src/transformations/document_silver_to_gold.py
          python -m py_compile src/transformations/image_bronze_to_silver.py
          python -m py_compile src/transformations/image_silver_to_gold.py
          python -m py_compile src/transformations/silver_to_gold.py
          python -m py_compile src/transformations/transcript_bronze_to_silver.py
          python -m py_compile src/transformations/transcript_silver_to_gold.py